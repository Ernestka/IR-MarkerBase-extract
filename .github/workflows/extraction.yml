name: Extraction

# Stage 2. Manual dispatch for now (it bills the API and is the heavier stage).
# Extracts ELIGIBLE papers into surveys/genotypes/bioassays/geno_pheno tables,
# validated in Python (src/validate.py), and rebuilds data/final/ir_extraction.{csv,xlsx}.
on:
  workflow_dispatch:
    inputs:
      max_per_run:
        description: "Max papers to extract this run"
        default: "10"
      model:
        description: "Model spec (flash-extract / pro / sonnet / opus / provider:model — see src/llm.py)"
        default: "flash-extract"

permissions:
  contents: write

concurrency:
  group: extraction
  cancel-in-progress: false

jobs:
  extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      # LibreOffice converts legacy .doc/.xls supplements (xlsx/docx/csv are
      # handled by Python libs). Guarantees an office reader is present.
      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc

      - name: Write service-account key
        run: printf '%s' "$DRIVE_SA_KEY" > "$RUNNER_TEMP/key.json"
        env:
          DRIVE_SA_KEY: ${{ secrets.DRIVE_SA_KEY }}

      - name: Run extraction
        run: python src/run_extraction.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/key.json
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_SUPPLEMENT_FOLDER_ID: ${{ secrets.DRIVE_SUPPLEMENT_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXTRACT_MODEL: ${{ inputs.model }}
          EXTRACT_MAX_PER_RUN: ${{ inputs.max_per_run }}

      - name: Commit extracted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/roster.csv data/extracted data/final docs/stats.svg README.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Extract studies"
          git pull --rebase --autostash
          git push
